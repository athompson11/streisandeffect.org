apiVersion: apps/v1
kind: Deployment
metadata:
  name: streisandeffect-web
  namespace: streisandeffect
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streisandeffect-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streisandeffect-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/REPLACE_ME/streisandeffect.org:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: documents
              mountPath: /usr/share/nginx/html/documents
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      volumes:
        - name: documents
          persistentVolumeClaim:
            claimName: streisandeffect-documents
