slug: amnestyinternational
title: Amnesty International UK Withdrawn Reports Archive
short_title: Withdrawn Amnesty UK reports
publisher: Amnesty International UK
status: active
summary: >-
  Amnesty International UK published these briefings in May and July 2026 and later withdrew both.
  Amnesty states that the July briefing bypassed internal review and fell short of its research and
  editorial standards; it also apologized to organizations collectively labelled “anti-rights.” This
  archive preserves the withdrawn documents for research, criticism, and historical record. The archive's
  editorial position is pro-trans, but the original documents, Amnesty’s current position, external criticism,
  and archive analysis are presented separately.
content_warning: >-
  This collection discusses anti-trans organizing, gender-critical political advocacy, and contested claims
  about organizations and campaigners. Some archived material may include claims that subjects dispute.
editorial_note: >-
  The archive operator is pro-trans and opposed to anti-trans political organizing. These withdrawn reports
  are preserved because Amnesty's publication, withdrawal, apology, and the surrounding public response are
  historically and politically significant. Factual chronology, publisher statements, external responses, and
  archive interpretation are separated below.
