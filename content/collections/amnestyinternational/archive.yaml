amnesty_position: >-
  Amnesty International UK withdrew the reports after public complaints and reported threatened legal action. Amnesty
  states that the July report bypassed its internal review process and fell short of its research and editorial
  standards. Amnesty apologized for collectively labelling organizations as anti-rights and specifically referenced
  Beira’s Place and other groups categorized as gender-critical organizations. The archive does not claim that legal
  pressure was the sole or established cause of withdrawal.
critics_statements:
  - label: Organizations labelled “anti-rights” raised concerns
    description: >-
      Amnesty states that it recognizes concerns raised by organizations labelled “anti-rights” in the July report.
    source_label: Amnesty International UK apology and briefing review
    source_url: https://www.amnesty.org.uk/briefing-review/
  - label: Additional reporting and rebuttals
    description: >-
      No additional independently verified reporting, criticism, or rebuttal links have been added yet. The archive
      will add them when direct source URLs are verified.
archive_interpretation: >-
  The publication and withdrawal are significant because the reports concern organized opposition to trans rights,
  media treatment of trans people, and broader anti-rights politics in the UK. Preserving the withdrawn PDFs allows
  readers to examine the original text alongside Amnesty's withdrawal statement, criticism, and verification data.
